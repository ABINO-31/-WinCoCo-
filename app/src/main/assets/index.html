<script>
const D=Math.PI/180,$=i=>document.getElementById(i);
const EL=[["CLARKE 1880 Afrique Anglaise",6378249.145,1/293.465],["HAYFORD 1924",6378388,1/297],["HAYFORD 1976",6378140,1/298.257],["CLARKE 1880 France",6378249.2,1/293.4660208],["CLARKE 1866",6378206.4,1/294.9786982],["KRASSOWSKY",6378245,1/298.3],["W.G.S 1984",6378137,1/298.257223563],["G.R.S 1980",6378137,1/298.257222101]];
const LZ=[{p:36,k:.999625544},{p:33.3,k:.999625769}],L0=2.7,FE=500135,FN=300090;
function ell(i){const[,a,f]=EL[i];return{a,f,e:Math.sqrt(f*(2-f))}}
function kr(el){const n=el.f/(2-el.f),n2=n*n,n3=n2*n,n4=n3*n,n5=n4*n,n6=n5*n;return{A:el.a/(1+n)*(1+n2/4+n4/64+n6/256),
al:[n/2-2*n2/3+5*n3/16+41*n4/180-127*n5/288+7891*n6/37800,13*n2/48-3*n3/5+557*n4/1440+281*n5/630-1983433*n6/1935360,61*n3/240-103*n4/140+15061*n5/26880+167603*n6/181440,49561*n4/161280-179*n5/168+6601661*n6/7257600,34729*n5/80640-3418889*n6/1995840,212378941*n6/319334400],
be:[n/2-2*n2/3+37*n3/96-n4/360-81*n5/512+96199*n6/604800,n2/48+n3/15-437*n4/1440+46*n5/105-1118711*n6/3870720,17*n3/480-37*n4/840-209*n5/4480+5569*n6/90720,4397*n4/161280-11*n5/504-830251*n6/7257600,4583*n5/161280-108847*n6/3991680,20648693*n6/638668800]}}

const xi=Math.atan2(t,Math.cos(l)),et=Math.atanh(Math.sin(l)/Math.sqrt(1+t*t));let X=xi,Y=et;
K.al.forEach((a,j)=>{const m=2*(j+1);X+=a*Math.sin(m*xi)*Math.cosh(m*et);Y+=a*Math.cos(m*xi)*Math.sinh(m*et)});

function u2g(el,E,N,fu){const e=el.e,K=kr(el);let xi=N/(.9996*K.A),et=(E-500000)/(.9996*K.A),x1=xi,e1=et;
K.be.forEach((b,j)=>{const m=2*(j+1);x1-=b*Math.sin(m*xi)*Math.cosh(m*et);e1-=b*Math.cos(m*xi)*Math.sinh(m*et)});

function lam(el,z){const e=el.e,P=LZ[z],p0=P.p*D,n=Math.sin(p0),m=p=>Math.cos(p)/Math.sqrt(1-e*e*Math.sin(p)**2),
t=p=>{const s=e*Math.sin(p);return Math.tan(Math.PI/4-p/2)/Math.pow((1-s)/(1+s),e/2)},F=m(p0)/(n*Math.pow(t(p0),n)),R=p=>el.a*P.k*F*Math.pow(t(p),n),r0=R(p0);

i:(X,Y)=>{const dx=X-FE,dy=r0-(Y-FN),r=Math.hypot(dx,dy),th=Math.atan2(dx,dy),tt=Math.pow(r/(el.a*P.k*F),1/n);let p=Math.PI/2-2*Math.atan(tt);
